<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Client Email Remover</title>
  <style>
    body { font-family: Arial, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    p { font-size: 12px; margin: 6px 0; color: #333; }
    button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
    #status { white-space: pre-wrap; background: #f6f6f6; border: 1px solid #ddd; padding: 8px; min-height: 84px; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
  <h1>Client Email Remover</h1>
  <p>Removes <strong>TARGET_EMAIL</strong> from record pages, with pagination and logging.</p>
  <div id="status">Ready.</div>
  <button id="startBtn">Start from this page</button>
  <div class="row">
    <button id="refreshBtn">Refresh status</button>
    <button id="exportBtn">Export log</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
