<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ExampleCo Client Updater</title>
  <style>
    body { font-family: Arial, sans-serif; width: 320px; padding: 12px; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    #status { font-size: 12px; white-space: pre-wrap; background: #f5f5f5; padding: 8px; border-radius: 6px; min-height: 80px; }
  </style>
</head>
<body>
  <button id="startBtn">Start from this page</button>
  <button id="collectBtn">Collect links only (download .txt)</button>
  <button id="exportBtn">Export logs</button>
  <button id="clearBtn">Clear logs/state</button>
  <div id="status">Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
